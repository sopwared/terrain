<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Procedural Terrain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; font-family: system-ui, sans-serif; }
  #ui { position: fixed; top: 12px; left: 12px; color: #fff; background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 8px; font-size: 13px; }
  #ui label { display: grid; grid-template-columns: 90px 140px 40px; align-items: center; gap: 6px; margin: 4px 0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <label>Seed <input id="seed" type="range" min="1" max="999" value="7"><span id="seedV">7</span></label>
  <label>Octaves <input id="oct" type="range" min="1" max="8" value="6"><span id="octV">6</span></label>
  <label>Height <input id="hgt" type="range" min="5" max="60" value="28"><span id="hgtV">28</span></label>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 1. Heightmap: seeded value noise + fBm ---------- */
function hash(x, y, s) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;               // [0,1]
}
function valueNoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);            // smoothstep fade
  const v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s),     b = hash(xi + 1, yi, s);
  const c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;  // bilinear
}
function makeHeightmap(N, seed, octaves) {
  const h = new Float32Array(N * N);
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      let amp = 1, freq = 3 / N * 1.0, sum = 0, norm = 0;
      for (let o = 0; o < octaves; o++) {
        sum += amp * valueNoise(j * freq, i * freq, seed + o * 101);
        norm += amp;
        amp *= 0.5;                             // halve amplitude
        freq *= 2;                              // double frequency
      }
      const v = sum / norm;
      h[i * N + j] = v;
      if (v < min) min = v;
      if (v > max) max = v;
    }
  }
  for (let k = 0; k < h.length; k++) {
    const t = (h[k] - min) / (max - min);       // normalize to [0,1]
    h[k] = Math.pow(t, 1.4);                    // flatten valleys a bit
  }
  return h;
}

/* ---------- 2-4. Mesh: vertices, UVs, triangles, normals ---------- */
const N = 257, SIZE = 100;
function buildGeometry(hm, heightScale) {
  const positions = new Float32Array(N * N * 3);
  const uvs       = new Float32Array(N * N * 2);
  const normals   = new Float32Array(N * N * 3);
  const step = SIZE / (N - 1);

  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const idx = i * N + j;
      positions[idx * 3 + 0] = (j / (N - 1) - 0.5) * SIZE;
      positions[idx * 3 + 1] = hm[idx] * heightScale;
      positions[idx * 3 + 2] = (i / (N - 1) - 0.5) * SIZE;
      uvs[idx * 2 + 0] = j / (N - 1);
      uvs[idx * 2 + 1] = i / (N - 1);
    }
  }

  // Normals via central differences. Tangents are (1, dy/dx, 0) and (0, dy/dz, 1);
  // their cross product (up to sign) is (-dy/dx, 1, -dy/dz).
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const jl = Math.max(j - 1, 0), jr = Math.min(j + 1, N - 1);
      const iu = Math.max(i - 1, 0), id = Math.min(i + 1, N - 1);
      const dydx = (hm[i * N + jr] - hm[i * N + jl]) * heightScale / ((jr - jl) * step);
      const dydz = (hm[id * N + j] - hm[iu * N + j]) * heightScale / ((id - iu) * step);
      const len = Math.hypot(dydx, 1, dydz);
      const idx = i * N + j;
      normals[idx * 3 + 0] = -dydx / len;
      normals[idx * 3 + 1] = 1 / len;
      normals[idx * 3 + 2] = -dydz / len;
    }
  }

  // Two triangles per quad, CCW seen from above so face normals point +Y.
  const indices = new Uint32Array((N - 1) * (N - 1) * 6);
  let t = 0;
  for (let i = 0; i < N - 1; i++) {
    for (let j = 0; j < N - 1; j++) {
      const a = i * N + j, b = a + 1, c = a + N, d = c + 1;
      indices[t++] = a; indices[t++] = c; indices[t++] = b;
      indices[t++] = b; indices[t++] = c; indices[t++] = d;
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('normal',   new THREE.BufferAttribute(normals, 3));
  g.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  g.setIndex(new THREE.BufferAttribute(indices, 1));
  return g;
}

/* ---------- 5-6. Shader: height color ramp + slope rock + Lambert ---------- */
const material = new THREE.ShaderMaterial({
  uniforms: {
    uHeightScale: { value: 28 },
    uLightDir:    { value: new THREE.Vector3(0.6, 0.8, 0.4).normalize() },
  },
  vertexShader: /* glsl */`
    uniform float uHeightScale;
    varying float vH;
    varying vec3 vN;
    void main() {
      vH = position.y / uHeightScale;           // back to [0,1]
      vN = normal;                              // mesh is at identity, so object space == world space
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uLightDir;
    varying float vH;
    varying vec3 vN;
    void main() {
      vec3 sand  = vec3(0.86, 0.80, 0.55);
      vec3 grass = vec3(0.22, 0.52, 0.20);
      vec3 rock  = vec3(0.45, 0.42, 0.40);
      vec3 snow  = vec3(0.97, 0.98, 1.00);

      vec3 col = sand;
      col = mix(col, grass, smoothstep(0.18, 0.30, vH));
      col = mix(col, rock,  smoothstep(0.55, 0.70, vH));
      col = mix(col, snow,  smoothstep(0.78, 0.88, vH));

      vec3 n = normalize(vN);
      float slope = 1.0 - n.y;                  // 0 flat, ->1 vertical
      col = mix(col, rock, smoothstep(0.15, 0.40, slope) * (1.0 - smoothstep(0.80, 0.90, vH)));

      float diff = max(dot(n, normalize(uLightDir)), 0.0);
      vec3 lit = col * (0.25 + 0.85 * diff);    // ambient + Lambert
      gl_FragColor = vec4(lit, 1.0);
    }`,
});

/* ---------- Scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(70, 55, 70);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(SIZE, SIZE).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x2a6fb0, transparent: true, opacity: 0.55 })
);
scene.add(water);

let mesh = null;
function rebuild() {
  const seed = +seedEl.value, oct = +octEl.value, hs = +hgtEl.value;
  seedV.textContent = seed; octV.textContent = oct; hgtV.textContent = hs;
  const hm = makeHeightmap(N, seed, oct);
  const geo = buildGeometry(hm, hs);
  material.uniforms.uHeightScale.value = hs;
  if (mesh) { mesh.geometry.dispose(); mesh.geometry = geo; }
  else { mesh = new THREE.Mesh(geo, material); scene.add(mesh); }
  water.position.y = 0.2 * hs;
}
const seedEl = document.getElementById('seed'), octEl = document.getElementById('oct'), hgtEl = document.getElementById('hgt');
const seedV = document.getElementById('seedV'), octV = document.getElementById('octV'), hgtV = document.getElementById('hgtV');
[seedEl, octEl, hgtEl].forEach(el => el.addEventListener('input', rebuild));
rebuild();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
